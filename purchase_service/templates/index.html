{% extends "base.html" %}

{% block title %}Главная{% endblock %}

{% block content %}
<h1>🛍️ Добро пожаловать в систему покупок</h1>
<p>Здесь вы можете просматривать товары, покупать их и искать нужные позиции.</p>

<div style="margin-top: 30px; display: flex; gap: 15px; flex-wrap: wrap;">
    <a href="/products" class="btn btn-primary">📋 Список товаров</a>
    <a href="/search" class="btn btn-primary">🔍 Поиск товаров</a>
    <a href="/stats" class="btn btn-primary">📊 Статистика</a>
</div>

<div style="margin-top: 40px;">
    <h3>🎯 Быстрый поиск</h3>
    <form action="/search" method="get">
        <input type="text" name="q" placeholder="Введите название товара..." style="width: 70%; padding: 10px; font-size: 16px;">
        <button type="submit" class="btn btn-primary">🔍 Искать</button>
    </form>
</div>
{% endblock %}
