<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Search Service{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .navbar { background: #2c3e50; color: white; padding: 15px 30px; display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
        .navbar a { color: white; text-decoration: none; padding: 8px 16px; border-radius: 5px; transition: background 0.3s; }
        .navbar a:hover { background: #34495e; }
        .navbar .logo { font-size: 1.5em; font-weight: bold; margin-right: auto; }
        .container { max-width: 1200px; margin: 30px auto; padding: 30px; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .search-box { width: 100%; padding: 15px; font-size: 18px; border: 2px solid #e2e8f0; border-radius: 50px; transition: all 0.3s; }
        .search-box:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .btn { display: inline-block; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; text-decoration: none; font-size: 14px; transition: all 0.3s; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a67d8; transform: translateY(-2px); }
        .product-card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 20px; transition: all 0.3s; }
        .product-card:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.1); transform: translateY(-2px); }
        .product-title { font-size: 1.3em; font-weight: bold; color: #2d3748; margin-bottom: 10px; }
        .product-description { color: #718096; margin-bottom: 15px; line-height: 1.5; }
        .product-price { font-size: 1.5em; font-weight: bold; color: #48bb78; }
        .product-stock { color: #e53e3e; margin-top: 10px; }
        .score { color: #a0aec0; font-size: 0.85em; margin-top: 10px; }
        .suggestions { position: absolute; background: white; border: 1px solid #e2e8f0; border-radius: 10px; max-height: 300px; overflow-y: auto; z-index: 1000; width: calc(100% - 30px); margin-top: 5px; }
        .suggestion-item { padding: 12px 15px; cursor: pointer; transition: background 0.2s; }
        .suggestion-item:hover { background: #f7fafc; }
        .highlight { background: #fef5e7; font-weight: bold; }
        .stats { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 15px; flex: 1; text-align: center; }
        .stat-number { font-size: 2.5em; font-weight: bold; }
        .stat-label { margin-top: 10px; opacity: 0.9; }
        .alert-error { background: #fed7d7; color: #742a2a; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .alert-info { background: #c6f6d5; color: #22543d; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="navbar">
        <div class="logo">🔍 Search Service</div>
        <a href="/">🏠 Главная</a>
        <a href="/search">🔎 Поиск</a>
        <a href="/about">ℹ️ О сервисе</a>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script>
        function searchWithQuery(query) {
            if (query) {
                window.location.href = `/search?q=${encodeURIComponent(query)}`;
            }
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
