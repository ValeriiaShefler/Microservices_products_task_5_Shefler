{% extends "base.html" %}

{% block content %}
<h2>{% if product %}Редактировать{% else %}Добавить{% endif %}</h2>

<form method="POST" action="{% if product %}/products/{{ product.id }}{% else %}/products{% endif %}">
    <div style="margin-bottom: 15px;">
        <label>Название:</label><br>
        <input type="text" name="title" value="{{ product.title if product else '' }}" required style="width: 100%; padding: 8px;">
    </div>
    <div style="margin-bottom: 15px;">
        <label>Описание:</label><br>
        <textarea name="description" style="width: 100%; padding: 8px;">{{ product.description if product else '' }}</textarea>
    </div>
    <div style="margin-bottom: 15px;">
        <label>Цена:</label><br>
        <input type="number" step="0.01" name="price" value="{{ product.price if product else '' }}" required style="width: 100%; padding: 8px;">
    </div>
    <div style="margin-bottom: 15px;">
        <label>Остаток:</label><br>
        <input type="number" name="stock" value="{{ product.stock if product else 0 }}" required style="width: 100%; padding: 8px;">
    </div>
    <button type="submit" style="background: #48bb78; color: white; padding: 10px 20px; border: none; border-radius: 8px;">Сохранить</button>
    <a href="/" style="background: #e53e3e; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px;">Отмена</a>
</form>
{% endblock %}
